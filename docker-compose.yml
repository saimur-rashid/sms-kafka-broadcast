services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - sms-network

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 40s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
    restart: unless-stopped
    networks:
      - sms-network

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    depends_on:
      - kafka
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      KAFKA_CLUSTERS_0_ZOOKEEPER: zookeeper:2181
    networks:
      - sms-network

  # ==================== TOPIC INITIALIZER ====================
  # Creates all required topics with correct names/partitions on every `up`.
  # Topic names here MUST match utils/config.json exactly.
  kafka-init:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - sms-network
    entrypoint: ["/bin/bash", "-c"]
    command: >
      "
      echo '⏳ Waiting for Kafka to be ready...' &&
      kafka-topics --bootstrap-server kafka:9092 --list &&
      echo '🚀 Creating topics...' &&
      kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic sms_topic --partitions 30 --replication-factor 1 &&
      kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic email_topic --partitions 30 --replication-factor 1 &&
      kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic sms_retry_topic --partitions 10 --replication-factor 1 &&
      kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic sms_dlq_topic --partitions 5 --replication-factor 1 &&
      echo '✅ Topics ready:' &&
      kafka-topics --bootstrap-server kafka:9092 --list
      "
    restart: "no"

  # ==================== PRODUCERS ====================
  producer-sms:
    build:
      context: .
      dockerfile: producers/Dockerfile
    container_name: producer-sms
    command: python producers/producer_sms.py
    depends_on:
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully  # ✅ Wait for topics to exist
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - PYTHONPATH=/app
      - TZ=Asia/Dhaka
      - PRODUCER_TYPE=sms
      - PYTHONUNBUFFERED=1
    volumes:
      - ./utils/config.json:/app/utils/config.json:ro
      - ./payment:/app/payment
      - ./logs:/app/logs
    restart: unless-stopped
    networks:
      - sms-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  producer-email:
    build:
      context: .
      dockerfile: producers/Dockerfile
    container_name: producer-email
    command: python producers/producer_email.py
    depends_on:
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully  # ✅ Wait for topics to exist
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - PYTHONPATH=/app
      - TZ=Asia/Dhaka
      - PRODUCER_TYPE=email
      - PYTHONUNBUFFERED=1
    volumes:
      - ./utils/config.json:/app/utils/config.json:ro
      - ./payment:/app/payment
      - ./logs:/app/logs
    restart: unless-stopped
    networks:
      - sms-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ==================== CONSUMERS ====================
  consumer-sms:
    build:
      context: .
      dockerfile: consumers/Dockerfile
    container_name: consumer-sms
    command: python consumers/consumer_sms.py
    depends_on:
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully  # ✅ Wait for topics to exist
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - PYTHONPATH=/app
      - TZ=Asia/Dhaka
      - CONSUMER_TYPE=sms
      - PYTHONUNBUFFERED=1
    volumes:
      - ./utils/config.json:/app/utils/config.json:ro
      - ./logs:/app/logs
    restart: unless-stopped
    networks:
      - sms-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  consumer-email:
    build:
      context: .
      dockerfile: consumers/Dockerfile
    container_name: consumer-email
    command: python consumers/consumer_email.py
    depends_on:
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully  # ✅ Wait for topics to exist
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - PYTHONPATH=/app
      - TZ=Asia/Dhaka
      - CONSUMER_TYPE=email
      - PYTHONUNBUFFERED=1
    volumes:
      - ./utils/config.json:/app/utils/config.json:ro
      - ./logs:/app/logs
    restart: unless-stopped
    networks:
      - sms-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ==================== RETRY ====================
  retry:
    build:
      context: .
      dockerfile: retry/Dockerfile
    container_name: retry-consumer
    depends_on:
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully  # ✅ Wait for topics to exist
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - PYTHONPATH=/app
      - TZ=Asia/Dhaka
      - PYTHONUNBUFFERED=1
    volumes:
      - ./utils/config.json:/app/utils/config.json:ro
      - ./logs:/app/logs
    restart: unless-stopped
    networks:
      - sms-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ==================== DLQ ====================
  dlq:
    build:
      context: .
      dockerfile: dlq/Dockerfile
    container_name: dlq-consumer
    depends_on:
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully  # ✅ Wait for topics to exist
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - PYTHONPATH=/app
      - TZ=Asia/Dhaka
      - PYTHONUNBUFFERED=1
    volumes:
      - ./utils/config.json:/app/utils/config.json:ro
      - ./logs:/app/logs
    restart: unless-stopped
    networks:
      - sms-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ==================== PAYMENT EXECUTOR ====================
  payment-executor:
    build:
      context: .
      dockerfile: payment/Dockerfile
    container_name: payment-executor
    depends_on:
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully  # ✅ Wait for topics to exist
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - PYTHONPATH=/app
      - TZ=Asia/Dhaka
      - PYTHONUNBUFFERED=1
    volumes:
      - ./utils/config.json:/app/utils/config.json:ro
      - ./payment:/app/payment
      - ./logs:/app/logs
    restart: unless-stopped
    networks:
      - sms-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  kafka_data:

networks:
  sms-network:
    driver: bridge